name: Azure Static Web Apps dev deployment

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azure-static-web-apps-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Required checks
    uses: ./.github/workflows/test.yml

  build_and_deploy_dev:
    if: github.ref == 'refs/heads/dev' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: ci
    runs-on: ubuntu-latest
    name: Build and Deploy dev
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          lfs: false
      - name: Stage Static App
        run: |
          rm -rf .swa-static
          mkdir -p .swa-static
          git archive --format=tar HEAD | tar -xf - -C .swa-static
          rm -rf .swa-static/api .swa-static/.github
      - name: Build And Deploy dev
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_RED_OCEAN_014D1E603 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: '.swa-static'
          api_location: 'api'
          output_location: ''
          skip_app_build: true
          production_branch: 'main'
