  maini-vai-mainies.html — "Maini vai mainies?" (Transitive vs Reflexive).
  Choose whether each sentence needs the transitive or reflexive
  verb form to practise -t / -ties distinction.
  Entry script: src/games/maini-vai-mainies/index.js
-->
<!doctype html>
<html lang="lv" data-bs-theme="auto">
  <head>

      content="default-src 'self'; script-src 'self' https:; style-src 'self' https: 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https:; font-src 'self' https: data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none';"
    />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#0e0f13" />
    <title>Maini vai mainies? — Latvian B Level</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png" />

      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="src/games/maini-vai-mainies/styles.css" />

  <body class="mvm-page game-theme theme-maini">
    <a class="skip-link" href="#main">Skip to main content</a>
    <nav data-site-nav></nav>

    <main id="main">
      <div class="mvm-app">
        <section class="mvm-screen" aria-labelledby="mvmTitle">
          <header class="mvm-hero">
            <span class="mvm-eyebrow">Darbības vārdu treniņš</span>
            <h1 class="mvm-title" id="mvmTitle">Maini vai mainies?</h1>
            <p class="mvm-lead" id="mvmInstructions">
              Izvēlies pareizo darbības vārda formu: refleksīvu vai nereflek­sīvu.
            </p>
          </header>

          <div class="mvm-stat-row" aria-label="Treniņa pārskats">
            <div class="mvm-stat"><strong>-t / -ties</strong><span>gramatikas fokuss</span></div>
            <div class="mvm-stat"><strong>2</strong><span>atbilžu varianti</span></div>
            <div class="mvm-stat"><strong>B</strong><span>līmenis</span></div>
          </div>

          <article class="mvm-card" id="mvmGame" aria-live="off">
            <header class="mvm-card__head">
              <div>
                <p class="mvm-prompt-label">Izvēlies pareizo formu</p>
                <p class="mvm-sentence" id="mvmSentence">–</p>
              </div>
              <div class="mvm-metrics">
                <span class="mvm-chip" id="mvmScore">score 0</span>
                <span class="mvm-chip" id="mvmStreak">streak 0</span>
              </div>
            </header>

            <div class="mvm-question-layout">
              <div class="mvm-avatar">
                <img
                  id="mvmAvatar"
                  src="assets/img/maini-vai-mainies/avatars/avatar-neutral.svg"
                  alt="Avatar"
                  loading="lazy"
                />
              </div>
              <div class="mvm-buttons">
                <button type="button" class="mvm-choice" id="mvmChoiceA" data-choice="0">
                  Option A
                </button>
                <button type="button" class="mvm-choice" id="mvmChoiceB" data-choice="1">
                  Option B
                </button>
              </div>
            </div>

            <div class="mvm-feedback" id="mvmFeedback" role="status" aria-live="polite"></div>
            <p class="mvm-hint" id="mvmHint"></p>
            <div
              class="mvm-live visually-hidden"
              id="mvmLive"
              role="status"
              aria-live="polite"
            ></div>

            <footer class="mvm-card__footer">
              <button class="mvm-ghost" id="mvmStart" hidden>Start</button>
              <button class="mvm-primary" id="mvmNext" disabled>Next</button>
            </footer>
          </article>
        </section>
      </div>
    </main>

    <footer class="border-top py-4 bg-body-tertiary mt-4" data-site-footer></footer>
